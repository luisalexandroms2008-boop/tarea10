<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 10</title>
    <style>
        #container{
         margin: 50px auto;
         width: 50%;
         border: 1px solid black;
         display: grid;
         padding: 10px;
         grid-template-areas: 
                              "izq sup sup da"
                              "izq  cen cin der"
                              "izq sip sep der";
        gap: 10px;
        grid-template-columns:  1fr 1fr 1fr 1fr;
        grid-template-rows: 100px 100px 100px ;
        }
        .uno{
            background-color: green;
            grid-area: izq;
        }
        .dos{
            background-color: green;
            grid-area: sup;
        }
        .tres{
            background-color: red;
            grid-area: da;
        }
        .cuatro{
            background-color: green;
            grid-area: der;
        }
        .cinco{
            background-color: rgb(255, 196, 0);
            grid-area: cen;
        }
        .seis{
            background-color: rgb(255, 196, 0);
            grid-area: sep;
        }
        .siete{
            background-color: red;
            grid-area: cin;
        }
        .ocho{
            background-color: red;
            grid-area: sip;
        }
        .caja{
            width: 100%;
            height: 100%;
            border: 1px solid black;
            align-content: center;
            text-align: center;
            color: white;
        }
        h1{
            text-align: center;
        
        }
    </style>
</head>
<body>
    <h1>Grid 1</h1>
    <div id="container">
     <div class="caja uno">UNO</div>
     <div class="caja dos">DOS</div>
     <div class="caja tres">TRES</div>
     <div class="caja cuatro">CUATRO</div>
     <div class="caja cinco">CINCO</div>
     <div class="caja seis">SEIS</div>
     <div class="caja siete">SIETE</div>
     <div class="caja ocho">OCHO</div>
    </div>
    
</body>
</html>
